services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SRA_APP_ENV
        value: production
      - key: SRA_ENABLE_LLM_RECOMMENDATIONS
        value: "true"
      - key: SRA_DATABASE_URL
        value: sqlite:///./data/smart_resume_analyzer.db
      - key: SRA_PUBLIC_APP_URL
        value: https://ai-resume-analyzer-bk7j.onrender.com
