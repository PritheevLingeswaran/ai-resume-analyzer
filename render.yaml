services:
  - type: web
    name: smart-resume-analyzer
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SRA_APP_ENV
        value: production
      - key: SRA_ENABLE_LLM_RECOMMENDATIONS
        value: "true"
      - key: SRA_DATABASE_URL
        value: sqlite:///./data/smart_resume_analyzer.db
